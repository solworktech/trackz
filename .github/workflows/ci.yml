---
# Build and test on Linux (libwnck backend, Gio on X11/Wayland) and macOS
# (AppKit backend), for pushes and pull requests.
name: CI

"on":
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libwnck/GTK for trackz; Gio's Wayland, X11, EGL/GLES and Vulkan
          # headers for trackz-viz; dbus for the tray test's session bus.
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config libwnck-3-dev libgtk-3-dev \
            libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libgles-dev libegl-dev libffi-dev libxcursor-dev libvulkan-dev \
            dbus

      - name: Build
        run: go build ./...

      - name: Test (Linux, with a private session bus)
        if: runner.os == 'Linux'
        run: dbus-run-session -- go test ./...

      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: go test ./...
