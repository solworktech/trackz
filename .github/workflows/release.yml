---
# Release for a version tag (v1.2.3): Linux archives, deb, rpm and Arch
# packages (.goreleaser.yaml), then macOS archives
# (.goreleaser.darwin.yaml). The Windows MSIs come from windows-installer.yml.
#
# The release uses the workflow's own token. For the Homebrew formula (not
# enabled yet), add a GH_TOKEN secret that can push to
# solworktech/homebrew-trackz and uncomment it below.
name: Release

"on":
  push:
    tags: ["v*"]

permissions:
  contents: write  # to create the release and upload to it

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # For apt in the arm64 container below.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install build dependencies (amd64, and an arm64 sysroot)
        run: |
          set -eu
          # libwnck/GTK for trackz; Gio's Wayland, X11, EGL/GLES and Vulkan
          # headers for trackz-viz (as in ci.yml).
          dev=(libwnck-3-dev libgtk-3-dev libwayland-dev libx11-dev
            libx11-xcb-dev libxkbcommon-x11-dev libgles-dev libegl-dev
            libffi-dev libxcursor-dev libvulkan-dev)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config gcc-aarch64-linux-gnu "${dev[@]}"

          # arm64: the same packages, installed by apt in an arm64 Ubuntu
          # container (under QEMU) and copied out as a sysroot for the cross
          # compiler (see the CC and PKG_CONFIG_* settings in
          # .goreleaser.yaml). Installing them next to the amd64 ones
          # (multiarch) does not work: some files that must be identical in
          # both, such as Pango-1.0.gir, are not.
          sysroot=/opt/sysroot-arm64
          docker run --platform linux/arm64 --name sysroot ubuntu:24.04 \
            sh -c 'apt-get update && DEBIAN_FRONTEND=noninteractive \
              apt-get install -y --no-install-recommends libc6-dev "$@"' \
            sh "${dev[@]}"
          sudo mkdir -p "$sysroot"
          docker export sysroot | sudo tar -x -C "$sysroot" \
            --exclude='dev/*' --exclude='proc/*' --exclude='sys/*'
          docker rm sysroot >/dev/null
          # Absolute symlinks would point into this machine: rebase them.
          sudo find "$sysroot/usr/lib" -type l -lname '/*' -print0 |
            while IFS= read -r -d '' link; do
              sudo ln -sfn "$sysroot$(readlink "$link")" "$link"
            done

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  darwin:
    # After the Linux job, which creates the release (with the changelog).
    needs: linux
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean -f .goreleaser.darwin.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GH_TOKEN: ${{ secrets.GH_TOKEN }}
