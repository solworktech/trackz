---
# macOS release: tar.gz archives for amd64 and arm64 (the Homebrew formula
# is commented out for now). Runs on macOS (cgo with the AppKit frameworks),
# after the Linux release (.goreleaser.yaml) has created the GitHub release;
# see .github/workflows/release.yml.
#
# Try it locally with:
#   goreleaser release --snapshot --clean -f .goreleaser.darwin.yaml
version: 2
project_name: trackz

before:
  hooks:
    - go mod tidy

builds:
  - &build
    id: trackz
    main: ./cmd/trackz
    binary: trackz
    # Apple's clang builds for either architecture on either Mac.
    env: [CGO_ENABLED=1]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/solworktech/trackz/internal/version.Version={{ .Tag }}
    goos: [darwin]
    goarch: [amd64, arm64]
  - <<: *build
    id: trackz-viz
    main: ./cmd/trackz-viz
    binary: trackz-viz

archives:
  - formats: ["tar.gz"]
    # this name template makes the OS and Arch compatible with `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE
      - README.md
      - packaging/launchd/org.solworktech.trackz.plist

checksum:
  # Not checksums.txt: the Linux release uploads that one.
  name_template: checksums-darwin.txt

changelog:
  disable: true

release:
  # Add the archives to the release the Linux job made; keep its notes.
  mode: keep-existing

